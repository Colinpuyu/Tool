<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>项目围挡计算系统 - 桌面重构版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', 'Microsoft YaHei', sans-serif; background-color: #f3f4f6; }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "uuid": "https://esm.sh/uuid@^13.0.0"
  }
}
</script>
</head>
<body class="flex items-center justify-center min-h-screen">
    <div class="max-w-2xl w-full bg-white p-10 rounded-2xl shadow-xl border border-gray-100 text-center">
        <div class="mb-6 flex justify-center">
            <div class="bg-indigo-600 p-4 rounded-full shadow-lg">
                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
            </div>
        </div>
        <h1 class="text-3xl font-extrabold text-gray-900 mb-4">项目围挡清单计算系统 (桌面版)</h1>
        <p class="text-gray-600 mb-8 leading-relaxed">系统已重构为基于 <span class="font-bold text-indigo-600">Python + PySide6 (Qt)</span> 的原生桌面程序，提供更强大的计算性能与离线导出能力。</p>
        
        <div class="bg-gray-50 p-6 rounded-xl border border-gray-200 text-left mb-8">
            <h2 class="font-bold text-gray-800 mb-3 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                如何运行桌面版？
            </h2>
            <ol class="space-y-3 text-sm text-gray-600 list-decimal pl-4">
                <li>确保本地已安装 <b>Python 3.9+</b> 环境。</li>
                <li>安装必要的 GUI 运行库：<br/><code class="bg-slate-800 text-indigo-300 p-2 rounded block mt-1">pip install PySide6</code></li>
                <li>运行 <b>main.py</b> 启动程序。</li>
                <li>若需生成 Windows 可执行文件 (.exe)，请使用 PyInstaller：<br/><code class="bg-slate-800 text-indigo-300 p-2 rounded block mt-1">pyinstaller --onefile --noconsole main.py</code></li>
            </ol>
        </div>

        <div class="flex gap-4 justify-center">
            <div class="px-6 py-3 bg-indigo-50 text-indigo-700 rounded-lg font-semibold text-sm border border-indigo-200">
                L/W 强制正整数校验
            </div>
            <div class="px-6 py-3 bg-green-50 text-green-700 rounded-lg font-semibold text-sm border border-green-200">
                L=1 特殊逻辑已集成
            </div>
        </div>
    </div>
</body>
</html>
